<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="sh2"><feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#131326"/><stop offset="100%" stop-color="#0D0D1C"/></linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7B6CF6"/><stop offset="100%" stop-color="#7B6CF6" stop-opacity=".4"/></linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4ADE80"/><stop offset="100%" stop-color="#4ADE80" stop-opacity=".4"/></linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBB024"/><stop offset="100%" stop-color="#FBB024" stop-opacity=".4"/></linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4ADE80" stop-opacity=".25"/><stop offset="100%" stop-color="#4ADE80" stop-opacity="0"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0D0D1C" stop-opacity="0"/><stop offset="100%" stop-color="#0D0D1C" stop-opacity="1"/></linearGradient>
  </defs>

  <!-- Background glows -->
  <circle cx="950" cy="140" r="200" fill="rgba(74,222,128,.05)"/>
  <circle cx="220" cy="400" r="150" fill="rgba(123,108,246,.05)"/>

  <!-- Main browser window -->
  <g filter="url(#sh)">
    <rect x="200" y="48" width="800" height="464" rx="14" fill="url(#scr)" stroke="rgba(255,255,255,.07)" stroke-width="1.5"/>
    <rect x="200" y="48" width="800" height="38" rx="14" fill="#131326"/>
    <rect x="200" y="72" width="800" height="14" fill="#131326"/>
    <circle cx="228" cy="67" r="5.5" fill="#FF5F57"/>
    <circle cx="246" cy="67" r="5.5" fill="#FEBC2E"/>
    <circle cx="264" cy="67" r="5.5" fill="#28C840"/>
    <rect x="340" y="56" width="320" height="20" rx="10" fill="rgba(255,255,255,.05)"/>
    <text x="500" y="70" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="rgba(255,255,255,.22)" text-anchor="middle">app.kockpit.io/dashboard</text>
  </g>

  <!-- Header bar -->
  <rect x="200" y="86" width="800" height="44" fill="rgba(255,255,255,.02)"/>
  <text x="220" y="114" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="rgba(238,238,248,.9)">Executive Dashboard</text>
  <text x="464" y="114" font-family="system-ui,sans-serif" font-size="9" fill="rgba(238,238,248,.3)">Q4 2024 · Real-time</text>
  <rect x="830" y="96" width="56" height="22" rx="11" fill="rgba(74,222,128,.12)" stroke="rgba(74,222,128,.2)" stroke-width="1"/>
  <circle cx="844" cy="107" r="4" fill="#4ADE80"/>
  <text x="854" y="112" font-family="system-ui,sans-serif" font-size="8" fill="#4ADE80">Live</text>
  <rect x="896" y="96" width="82" height="22" rx="11" fill="rgba(255,255,255,.06)"/>
  <text x="937" y="111" font-family="system-ui,sans-serif" font-size="8" fill="rgba(238,238,248,.5)" text-anchor="middle">Export Report</text>

  <!-- KPI Row -->
  <!-- KPI 1: Revenue -->
  <rect x="208" y="138" width="185" height="78" rx="10" fill="rgba(123,108,246,.08)" stroke="rgba(123,108,246,.2)" stroke-width="1"/>
  <text x="224" y="160" font-family="system-ui,sans-serif" font-size="9" fill="rgba(238,238,248,.45)">Total Revenue</text>
  <text x="224" y="190" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#EEEEF8" letter-spacing="-1">$4.8M</text>
  <text x="224" y="206" font-family="system-ui,sans-serif" font-size="8.5" fill="#4ADE80">↑ 28.4% YoY</text>

  <!-- KPI 2: Growth -->
  <rect x="401" y="138" width="185" height="78" rx="10" fill="rgba(74,222,128,.06)" stroke="rgba(74,222,128,.15)" stroke-width="1"/>
  <text x="417" y="160" font-family="system-ui,sans-serif" font-size="9" fill="rgba(238,238,248,.45)">User Growth</text>
  <text x="417" y="190" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#EEEEF8" letter-spacing="-1">+24%</text>
  <text x="417" y="206" font-family="system-ui,sans-serif" font-size="8.5" fill="#4ADE80">↑ 12K new users</text>

  <!-- KPI 3: Churn -->
  <rect x="594" y="138" width="185" height="78" rx="10" fill="rgba(251,176,36,.05)" stroke="rgba(251,176,36,.15)" stroke-width="1"/>
  <text x="610" y="160" font-family="system-ui,sans-serif" font-size="9" fill="rgba(238,238,248,.45)">Churn Rate</text>
  <text x="610" y="190" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#EEEEF8" letter-spacing="-1">2.1%</text>
  <text x="610" y="206" font-family="system-ui,sans-serif" font-size="8.5" fill="#FBB024">▾ 0.4% vs last Q</text>

  <!-- KPI 4: NPS -->
  <rect x="787" y="138" width="205" height="78" rx="10" fill="rgba(240,98,146,.05)" stroke="rgba(240,98,146,.12)" stroke-width="1"/>
  <text x="803" y="160" font-family="system-ui,sans-serif" font-size="9" fill="rgba(238,238,248,.45)">NPS Score</text>
  <text x="803" y="190" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#EEEEF8" letter-spacing="-1">72</text>
  <text x="803" y="206" font-family="system-ui,sans-serif" font-size="8.5" fill="#4ADE80">↑ 8 points</text>

  <!-- Left chart: Revenue Bar Chart -->
  <rect x="208" y="226" width="480" height="200" rx="10" fill="rgba(255,255,255,.015)" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
  <text x="224" y="248" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="rgba(238,238,248,.7)">Monthly Revenue</text>
  <text x="646" y="248" font-family="system-ui,sans-serif" font-size="8" fill="rgba(238,238,248,.35)">vs Target</text>

  <!-- Bar chart bars -->
  <!-- x baseline at y=408, max bar height 130 -->
  <!-- Monthly bars: Jan-Dec -->
  <rect x="228" y="368" width="22" height="40" rx="4" fill="url(#bar1)" opacity=".7"/>
  <rect x="260" y="355" width="22" height="53" rx="4" fill="url(#bar1)" opacity=".7"/>
  <rect x="292" y="340" width="22" height="68" rx="4" fill="url(#bar1)" opacity=".8"/>
  <rect x="324" y="330" width="22" height="78" rx="4" fill="url(#bar1)" opacity=".8"/>
  <rect x="356" y="318" width="22" height="90" rx="4" fill="url(#bar1)"/>
  <rect x="388" y="305" width="22" height="103" rx="4" fill="url(#bar1)"/>
  <rect x="420" y="295" width="22" height="113" rx="4" fill="url(#bar2)"/>
  <rect x="452" y="282" width="22" height="126" rx="4" fill="url(#bar2)"/>
  <rect x="484" y="290" width="22" height="118" rx="4" fill="url(#bar2)"/>
  <rect x="516" y="275" width="22" height="133" rx="4" fill="url(#bar2)"/>
  <rect x="548" y="268" width="22" height="140" rx="4" fill="url(#bar2)"/>
  <rect x="580" y="260" width="22" height="148" rx="4" fill="url(#bar2)"/>
  <!-- Target line -->
  <line x1="224" y1="310" x2="680" y2="310" stroke="rgba(251,176,36,.4)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="624" y="306" font-family="system-ui,sans-serif" font-size="7.5" fill="#FBB024">Target</text>

  <!-- X-axis labels -->
  <text x="228" y="423" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(238,238,248,.3)">Jan</text>
  <text x="356" y="423" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(238,238,248,.3)">May</text>
  <text x="484" y="423" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(238,238,248,.3)">Sep</text>
  <text x="580" y="423" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(238,238,248,.3)">Dec</text>

  <!-- Right chart: Line chart / Retention -->
  <rect x="696" y="226" width="296" height="200" rx="10" fill="rgba(255,255,255,.015)" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
  <text x="712" y="248" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="rgba(238,238,248,.7)">User Retention</text>
  <!-- Area fill -->
  <path d="M714 395 L740 375 L770 365 L810 350 L840 345 L870 335 L900 330 L930 320 L960 315 L980 312 L980 408 L714 408 Z" fill="url(#lineGrad)"/>
  <!-- Line -->
  <polyline points="714,395 740,375 770,365 810,350 840,345 870,335 900,330 930,320 960,315 980,312" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data point -->
  <circle cx="980" cy="312" r="5" fill="#4ADE80"/>
  <rect x="944" y="295" width="46" height="20" rx="4" fill="rgba(74,222,128,.15)"/>
  <text x="967" y="309" font-family="system-ui,sans-serif" font-size="9" fill="#4ADE80" text-anchor="middle" font-weight="700">89%</text>
  <!-- Y axis labels -->
  <text x="700" y="340" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(238,238,248,.25)">80%</text>
  <text x="700" y="370" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(238,238,248,.25)">70%</text>
  <text x="700" y="405" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(238,238,248,.25)">60%</text>

  <!-- Fade -->
  <rect x="200" y="420" width="800" height="92" fill="url(#fade)"/>

  <!-- Floating card 1 -->
  <g filter="url(#sh2)" transform="translate(22, 100)">
    <rect width="160" height="98" rx="14" fill="#131326" stroke="rgba(74,222,128,.28)" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="3" rx="1.5" fill="#4ADE80"/>
    <text x="18" y="26" font-family="system-ui,sans-serif" font-size="10" fill="rgba(238,238,248,.5)">Revenue Growth</text>
    <text x="18" y="58" font-family="system-ui,sans-serif" font-size="30" font-weight="800" fill="#EEEEF8" letter-spacing="-1">+28%</text>
    <text x="18" y="80" font-family="system-ui,sans-serif" font-size="9.5" fill="#4ADE80">YoY — Q4 2024</text>
  </g>

  <!-- Floating card 2 -->
  <g filter="url(#sh2)" transform="translate(12, 290)">
    <rect width="160" height="98" rx="14" fill="#131326" stroke="rgba(123,108,246,.28)" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="3" rx="1.5" fill="#7B6CF6"/>
    <text x="18" y="26" font-family="system-ui,sans-serif" font-size="10" fill="rgba(238,238,248,.5)">Active Metrics</text>
    <text x="18" y="58" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#EEEEF8" letter-spacing="-2">5</text>
    <text x="18" y="80" font-family="system-ui,sans-serif" font-size="9.5" fill="rgba(238,238,248,.4)">Live dashboards</text>
  </g>

  <!-- Floating card 3 -->
  <g filter="url(#sh2)" transform="translate(1016, 170)">
    <rect width="160" height="98" rx="14" fill="#131326" stroke="rgba(251,176,36,.25)" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="3" rx="1.5" fill="#FBB024"/>
    <text x="18" y="26" font-family="system-ui,sans-serif" font-size="10" fill="rgba(238,238,248,.5)">Data Sources</text>
    <text x="18" y="58" font-family="system-ui,sans-serif" font-size="30" font-weight="800" fill="#EEEEF8" letter-spacing="-1">12</text>
    <text x="18" y="80" font-family="system-ui,sans-serif" font-size="9.5" fill="rgba(238,238,248,.4)">Connected live</text>
  </g>
</svg>
